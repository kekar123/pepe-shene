<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a class="heading" href="#"><h1>FM Assistant - Работа с отчётами</h1></a>
        <nav class="header-links">
            <a href="{{ url_for('warehouse_page') }}" style="background-color: #3d4170; border-radius: 15px; padding: 10px 15px;">Склад</a>
            <a href="{{ url_for('combined_page') }}">Общий отчет</a>
        </nav>
    </div>
</header>

<div id="notification" class="notification">
    <span id="notification-text"></span>
    <button class="close-notification" onclick="hideNotification()" aria-label="Закрыть">&times;</button>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<main class="page-container warehouse-page-container">
    <div class="container">
        <div class="upload-section warehouse-upload-section">
            <div class="upload-title">Схема склада</div>
            <div class="warehouse-map-box">
                <div class="warehouse-report-controls">
                    <input type="file" id="warehouseReportInput" class="file-input" accept=".xls,.xlsx">
                    <button id="warehouseReportChooseBtn" class="upload-button" type="button">Выбрать отчет</button>
                    <button id="warehouseReportApplyBtn" class="upload-button" type="button">Построить схему</button>
                    <span id="warehouseReportFileName" class="warehouse-report-file-name">Файл не выбран</span>
                </div>
                <div class="warehouse-legend">
                    <div class="warehouse-legend-item">
                        <span class="warehouse-legend-swatch warehouse-legend-swatch-cell"></span>
                        <span>Ячейка пикинга</span>
                    </div>
                    <div class="warehouse-legend-item">
                        <span class="warehouse-legend-swatch warehouse-legend-swatch-passage"></span>
                        <span>Проход (21-24)</span>
                    </div>
                    <div class="warehouse-legend-item">
                        <span class="warehouse-legend-swatch warehouse-legend-swatch-stock-red"></span>
                        <span>Сток: красный</span>
                    </div>
                    <div class="warehouse-legend-item">
                        <span class="warehouse-legend-swatch warehouse-legend-swatch-stock-yellow"></span>
                        <span>Сток: желтый</span>
                    </div>
                    <div class="warehouse-legend-item">
                        <span class="warehouse-legend-swatch warehouse-legend-swatch-stock-green"></span>
                        <span>Сток: зеленый</span>
                    </div>
                </div>
                <div id="warehouseMapMeta" class="warehouse-map-meta"></div>
                <div id="warehouseMapGrid" class="warehouse-map-grid"></div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-inner">
        ©2026 SKLAD | Проект Ногинского колледжа
    </div>
</footer>

<script src="{{ url_for('static', filename='js/warehouse.js') }}"></script>
</body>
</html>
